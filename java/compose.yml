# Optional PostgreSQL setup for manual app runs; integration tests use their own containers.
name: time-deposit-kata

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: time_deposits
      # Reuse the app's credential variable names without committing actual credentials.
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME before starting PostgreSQL}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting PostgreSQL}
    ports:
      # Local access only; set DB_PORT if another local database already uses port 5432.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 17 stores its data here; the named volume survives normal compose down.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ leaves expansion to the container shell; TCP avoids the temporary initialization server.
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
