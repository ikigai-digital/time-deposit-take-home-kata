# Local PostgreSQL matching the application datasource: postgres:16-alpine,
# database timedeposit. Flyway creates the tables and sample rows on startup.
# Host port 5433 avoids the PostgreSQL that already listens on 5432.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: timedeposit
      POSTGRES_USER: timedeposit
      POSTGRES_PASSWORD: timedeposit
    ports:
      - "5433:5432"
    volumes:
      - timedeposit-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timedeposit -d timedeposit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  timedeposit-data:
