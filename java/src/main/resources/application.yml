server:
  port: 0

spring:
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.xml
  h2:
    console.enabled: true
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:dcbapp
    username: sa
    password: password
  jpa:
    spring.jpa.database-platform: org.hibernate.dialect.H2Dialect

