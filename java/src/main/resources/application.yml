spring:
  application:
    name: time-deposit
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/timedeposit}
    username: ${DB_USERNAME:timedeposit}
    password: ${DB_PASSWORD:timedeposit}
  flyway:
    # db/migration = schema (all environments); db/sample-data = demo rows for trying the API locally.
    locations: classpath:db/migration,classpath:db/sample-data
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
      ddl-auto: validate
