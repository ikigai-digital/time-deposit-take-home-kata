spring:
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.xml
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: sa
    password: sa
  jpa:
    spring:
      jpa:
        properties:
          hibernate:
            temp:
              use_jdbc_metadata_defaults: false
        database-platform: org.hibernate.dialect.H2Dialect

