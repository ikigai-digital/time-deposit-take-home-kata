# Local runtime database for the application (tests use Testcontainers instead).
# Start:  docker compose up -d      Stop: docker compose down      Wipe data: docker compose down -v
# Credentials and port match the defaults in src/main/resources/application.yml.
services:
  postgres:
    image: postgres:17-alpine
    container_name: time-deposit-postgres
    environment:
      POSTGRES_DB: timedeposit
      POSTGRES_USER: timedeposit
      POSTGRES_PASSWORD: timedeposit
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timedeposit -d timedeposit"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
