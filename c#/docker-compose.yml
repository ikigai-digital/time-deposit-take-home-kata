services:
  postgres:
    image: postgres:16-alpine
    container_name: time-deposit-postgres
    environment:
      POSTGRES_DB: timedeposits
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - time-deposit-network

  api:
    build:
      context: ./time-deposit-kata-net
      dockerfile: Dockerfile
    container_name: time-deposit-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=timedeposits;Username=postgres;Password=postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - time-deposit-network

volumes:
  postgres_data:

networks:
  time-deposit-network:
    driver: bridge
