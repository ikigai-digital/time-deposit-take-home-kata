openapi: 3.0.3
info:
  title: XA Bank Time Deposit API
  description: |
    Contract-first API for XA Bank time deposits.
    The server interface and DTOs are generated from this file (openapi-generator, kotlin-spring).
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local
tags:
  - name: TimeDeposits
    description: Time deposit operations
paths:
  /time-deposits:
    get:
      tags: [TimeDeposits]
      operationId: getTimeDeposits
      summary: Retrieve all time deposits, page by page
      description: Returns one page of time deposits ordered by id, together with their withdrawals.
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page number (negative values are treated as 0).
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          description: Page size (values outside 1..1000 are clamped).
          schema:
            type: integer
            format: int32
            default: 100
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: One page of time deposits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeDepositPage'
  /time-deposits/balance-updates:
    post:
      tags: [TimeDeposits]
      operationId: updateBalances
      summary: Update the balances of all time deposits
      description: |
        Applies the current month's interest to every time deposit that has not received it yet
        and persists the new balances. Idempotent: interest is applied at most once per deposit per
        calendar month (UTC), so repeated or parallel calls are safe.
      responses:
        '204':
          description: Balances updated
components:
  schemas:
    TimeDepositPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TimeDeposit'
        page:
          type: integer
          format: int32
          description: Zero-based number of this page.
          example: 0
        size:
          type: integer
          format: int32
          description: Requested page size.
          example: 100
        totalElements:
          type: integer
          format: int64
          description: Total number of time deposits.
          example: 6
        totalPages:
          type: integer
          format: int32
          example: 1
    TimeDeposit:
      type: object
      required: [id, planType, balance, days, withdrawals]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        planType:
          type: string
          description: Plan type of the deposit (basic, student, premium).
          example: basic
        balance:
          type: number
          description: Current balance with cents.
          example: 1000.83
        days:
          type: integer
          format: int32
          description: Number of days since the deposit was opened.
          example: 31
        withdrawals:
          type: array
          items:
            $ref: '#/components/schemas/Withdrawal'
    Withdrawal:
      type: object
      required: [id, amount, date]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        amount:
          type: number
          example: 100.00
        date:
          type: string
          format: date
          example: '2026-01-15'
